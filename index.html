<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обо мне</title>

    <style>
        :root {
            --ink: #1d1b4d;
            --sun: #ffd23f;
            --coral: #ff6b6b;
            --mint: #3ddbb0;
            --paper: #fff8ec;
        }
        * { box-sizing: border-box;}
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--coral), var(--sun), var(--mint));
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 10px 10px 0 var(--ink);
            text-align: center;
        }
        .avatar {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            font-size: 60px;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 50%;
        }
        h1{
            margin: 0 0 6px;
            font-size: 2rem;
        }
        .role {
            margin: 0 0 20px;
            font-weight: bold;
            color : var(--coral);
        }
        p{
            line-height: 1.5;
        }
        ul{
            list-style:none;
            padding: 0;
            margin: 20px 0 26px;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        li{
            padding:8px 14px;
            background-color: var(--mint);
            border: 3px solid var(--ink);
            border-radius: 999px;
            font-weight: bold;
            margin-bottom: 14px;
        }
        button{
            font: inherit;
            font-weight: bold;
            padding:14px 28px;
            color:var(--ink);
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius:16px;
            box-shadow:5px 5px 0 var(--ink);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;

        }
        botton:hover{
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 var(--ink);
        }
        button:active{
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 var(--ink);
        }
        botton:focus-visible{
            outline-offset: 4px;
        }
        #hello{
            min-height: 1.5em;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bolder;
        }

    </style>
</head>
<body>
    <main class="card">
        <div class="avatar">🦉</div>
        <h1>Привет, я Сова!</h1>
        <p class="role">Юный веб-дизайнер</p>
        <p>Мне 4 года. Я умею летать и мне нравятся сайты! Поэтому я учусь на веб-дизайне)</p>
        <ul>
            <li>👻 Игры</li>
            <li>👀 Рисование</li>
            <li>😎 Космос</li>
            <li>🐱 Котики</li>
        </ul>

        <button id="btn">Нажми меня</button>
        <p id="hello"></p>
    </main>

    <script>
        const phrases = ["приветствую ♂ и ♀"];
        let n=0;
        document.getElementById("btn").addEventListener
        ("click",function(){
            document.getElementById("hello").textContent
            = phrases[n%phrases.length];
            n++;
        });
    </script>
</body>
</html>
